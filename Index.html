<!DOCTYPE html>

        }

            font-size: 1.25em; 
            line-height: 1.7; 
            background: rgba(0,0,0,0.5); 
            padding: 35px; 
            border-radius: 15px;
            text-align: left;
        }
    </style>
</head>

</html>
